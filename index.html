<title>Purdue Rationality</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* The GIF has a baked white background (no alpha), so the page
   ground must stay #ffffff or a 480x480 white box shows.

   One screen, no scrolling: the page is a centred flex column
   sized to the viewport, and the GIF is capped in BOTH axes so
   it yields space to the text on short screens. dvh (not vh)
   so mobile browser chrome is accounted for. */
body{
  background:#ffffff;
  color:#000000;
  margin:0;
  box-sizing:border-box;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,2vh,26px);
  padding:clamp(12px,2.5vh,32px) clamp(52px,14vw,120px);
  text-align:center;
  /* sized by width on phones, but capped by height on short
     screens so landscape still fits */
  font-size:clamp(15px,min(4.6vw,3vh),26px);
  line-height:1.4;
}
img{
  flex:0 1 auto;
  min-height:0;
  width:auto;
  height:auto;
  max-width:min(100%,360px);
  max-height:48vh;
  max-height:48dvh;
}
.text{
  display:flex;
  flex-direction:column;
  gap:clamp(8px,1.6vh,20px);
}
/* THIS is what sets the visible left/right margin: the text is
   wider than the rat (the rat fills only 59% of its frame), so
   the text cap is the real margin control, not the image cap. */
/* ch, not px: line count follows characters-per-line, so a px cap
   silently changes the break count as the font scales. 31ch keeps
   the announcement at 3 lines and the link lines at 1, at every
   font size - and is ~19% wider than the 26ch it started at. */
p{margin:0;max-width:31ch;text-wrap:balance}
</style>
