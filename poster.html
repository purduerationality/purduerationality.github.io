<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   Printable poster, US Letter portrait.
   Derived from the homepage: same words, same lowercase voice,
   same default serif. Print-specific changes: the animated GIF
   becomes a fixed frame (print stops on an arbitrary frame
   otherwise), and the two links become scannable QR codes.

   @page margin is 0 on purpose. Browsers put their own header
   and footer - title, URL, page number, date - in the page
   margin box, so removing the margin removes them. The safe
   area comes back as padding on .sheet instead.
   ============================================================ */
@page{ size:letter portrait; margin:0; }

html{background:#d8d8d8}
body{margin:0;color:#000;font-size:12pt}

.sheet{
  width:8.5in; height:11in;
  padding:0.5in;                 /* inside the printer's unprintable edge */
  margin:0.4in auto;
  background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.28);
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
  text-align:center;
  overflow:hidden;
}

.rat{ height:4.15in; width:auto; display:block; margin-top:.15in }

h1{
  font-size:52pt; font-weight:normal; line-height:1;
  margin:0; letter-spacing:-.01em;
}
.when{ font-size:23pt; line-height:1.25; margin:.11in 0 0 }
.room{ white-space:nowrap }

.codes{
  display:flex; gap:.85in; align-items:flex-start; justify-content:center;
  margin:0;
}
.code{ margin:0; width:2.05in }
.qr{ width:2.05in; height:2.05in; display:block }
figcaption{ font-size:13pt; line-height:1.3; margin-top:.07in }

.url{ font-size:13pt; margin:0 0 .12in; letter-spacing:.01em }

/* screen-only helper; never printed */
.hint{
  max-width:8.5in; margin:0 auto 1in; text-align:center;
  font-size:11pt; color:#333; line-height:1.6;
}
.hint button{ font:inherit; padding:.35em 1em; cursor:pointer }
.hint small{ display:block; color:#666; margin-top:.5rem }

@media print{
  html,body{ background:#fff; width:8.5in; height:11in; overflow:hidden }
  .sheet{ margin:0; box-shadow:none; page-break-after:avoid }
  .hint{ display:none !important }
}
</style>
