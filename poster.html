<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   Printable poster, US Letter portrait.
   Same words, lowercase voice and default serif as the homepage.
   Print-specific: the GIF becomes a fixed frame, and the two
   links become QR codes.

   @page margin is 0 on purpose - browsers draw their header and
   footer (title, URL, page number, date) into the page margin
   box, so removing the margin removes them. The safe area comes
   back as padding on .sheet.
   ============================================================ */
@page{ size:letter portrait; margin:0; }

/* border-box is load-bearing: .sheet carries 0.5in of padding as
   its safe area, and without this its 8.5x11in would become
   9.5x12in - overflowing the page, clipping the right and bottom,
   and pushing centred content 0.5in off-centre. */
*{box-sizing:border-box}

html{background:#d8d8d8}
body{margin:0;color:#000;font-size:12pt}

/* The sheet is a true 8.5x11in block. On a window narrower than
   that, `margin:auto` cannot centre an over-wide element - it
   overflows right and looks off-centre - so the stage scales it
   down to fit instead. Print resets the scale. */
.stage{ display:flex; justify-content:center; padding:.4in 0 }
.sheet{
  width:8.5in; height:11in;
  padding:0.5in;
  background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.28);
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
  text-align:center;
  overflow:hidden;
  transform-origin:top center;
  flex:0 0 auto;
}

.rat{ height:3.95in; width:auto; display:block; margin-top:.1in }

h1{ font-size:52pt; font-weight:normal; line-height:1; margin:0; letter-spacing:-.01em }
.when{ font-size:23pt; line-height:1.25; margin:.11in 0 0 }
.room{ white-space:nowrap }

.codes{ display:flex; gap:.7in; align-items:flex-start; justify-content:center; margin:0 }
.code{ margin:0; width:2.55in }
.qr{ width:2.55in; height:2.55in; display:block }
figcaption{ font-size:14pt; line-height:1.3; margin-top:.09in }

.url{ font-size:13pt; margin:0 0 .1in; letter-spacing:.01em }

.hint{
  max-width:8.5in; margin:0 auto 1in; text-align:center;
  font-size:11pt; color:#333; line-height:1.6;
}
.hint button{ font:inherit; padding:.35em 1em; cursor:pointer }
.hint small{ display:block; color:#666; margin-top:.5rem }

@media print{
  html,body{ background:#fff; width:8.5in; height:11in; overflow:hidden }
  .stage{ display:block; padding:0; height:auto !important }
  .sheet{ box-shadow:none; transform:none !important; page-break-after:avoid }
  .hint{ display:none !important }
}
</style>

<script>
/* Scale the on-screen preview to fit narrow windows, so the sheet
   stays visually centred instead of overflowing to one side. */
(function(){
  var stage = document.getElementById('stage'), sheet = document.getElementById('sheet');
  function fit(){
    sheet.style.transform = 'none';
    stage.style.height = '';
    var avail = stage.clientWidth - 24;
    var natural = sheet.offsetWidth;
    if(!natural) return;
    var s = Math.min(1, avail / natural);
    if(s < 1){
      sheet.style.transform = 'scale(' + s + ')';
      stage.style.height = (sheet.offsetHeight * s) + 'px';
    }
  }
  fit();
  addEventListener('resize', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener('beforeprint', function(){ sheet.style.transform='none'; stage.style.height=''; });
  addEventListener('afterprint', fit);
})();
</script>
